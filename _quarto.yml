project:
  type: book
  output-dir: docs
  post-render: ./redirects.sh

book:
  title: "Environmental Data Literacy"
  license: "CC BY-NC"
  author: 
    - name: Rodney Dyer
      orcid: 0000-0003-4707-3453
      email: rjdyer@vcu.edu
      affiliations: 
      - name: School for Life Sciences and Sustainability
        address: Virginia Commonwealth university
        city: Richmond
        state: VA
        postal-code: 23284
  date: last-modified
  chapters:
    - index.qmd
    - syllabus.qmd
    - part: "part1.qmd"
      chapters:
        - chapters/markdown/narrative.qmd
        - chapters/datatypes/narrative.qmd
        - chapters/containers/narrative.qmd
        - chapters/tidyverse/narrative.qmd
        - chapters/factors/narrative.qmd
        - chapters/joins/narrative.qmd
        - chapters/classic/narrative.qmd
        - chapters/ggplot/narrative.qmd
    - part: "part2.qmd"
      chapters:
        - chapters/points/narrative.qmd
        - chapters/vector/narrative.qmd
        - chapters/rasters/narrative.qmd
    - part: "part3.qmd"
      chapters:
        - chapters/correlation/narrative.qmd
        - chapters/regression/narrative.qmd
        - chapters/aov/narrative.qmd
        - chapters/ordination/narrative.qmd

format:
  html:
    css: media/style.css
    toc: true
    toc-depth: 2
    number-sections: true
    number-depth: 1
    theme:
      - cosmo

